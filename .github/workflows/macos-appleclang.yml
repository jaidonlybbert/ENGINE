name: macOS-AppleClang

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install conan
        run: |
          python -m pip install conan

      # AppleClang's version tracks the Xcode release on the runner image, which changes
      # over time - detect it instead of hardcoding a compiler.version that would go stale.
      - name: Detect native Conan profile
        run: conan profile detect --force

      - name: Install Conan profile overrides
        run: conan config install ${{github.workspace}}/profiles/macOS-AppleClang-arm64 --type=file --target-folder=profiles

      - name: Install deps (Conan)
        run: conan install . -pr:a default -pr:a macOS-AppleClang-arm64 --output-folder ${{github.workspace}} --build=missing

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.335.0
          cache: true

      - name: verify vulkan
        run: ls "${VULKAN_SDK}"

      - name: CMake Configure & Build
        run: |
          cmake --preset conan-release -DCMAKE_BUILD_TYPE=Release
          cmake --build --preset conan-release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
