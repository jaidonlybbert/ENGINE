name: Docker Agent Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Agent Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No real secrets here - just enough for `docker compose config` to substitute
      # variables and confirm the compose file itself is well-formed.
      - name: Validate compose config
        run: |
          cd docker
          cp .env.example .env
          echo "ANTHROPIC_API_KEY=ci-placeholder" >> .env
          docker compose config

      - name: Build agent image
        run: docker build -t engine-agent:ci docker/agent

      # Runs the real entrypoint (clone + submodules included, so this also proves the
      # allowlist is enough for that) and then checks the firewall it applied: blocked vs
      # allowed destinations, and that the agent user can't undo it. Same capabilities as
      # docker/docker-compose.yml grants.
      - name: Test egress firewall
        run: |
          docker run --rm --cap-drop ALL \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SETUID --cap-add SETGID --cap-add AUDIT_WRITE \
            engine-agent:ci bash -euxc '
              ! curl -sS --connect-timeout 5 https://example.com
              curl -sSf --connect-timeout 10 https://api.github.com/zen
              curl -sS --connect-timeout 10 -o /dev/null https://api.anthropic.com
              curl -sS --connect-timeout 10 -o /dev/null https://center2.conan.io
              test -f /workspace/third_party/imgui/imgui.h
              ! iptables -F
              ! sudo -n iptables -F
              ! sudo -n /bin/true
            '
