name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  DISPLAY: ':99.0'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (apt)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository universe
          sudo add-apt-repository ppa:ubuntu-toolchain-r/ppa -y
          sudo apt-get update
          sudo apt-get install -y libwayland-dev xorg-dev gcc-14 cmake

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install conan
        run: |
          python -m pip install conan

      - name: Virtual X server
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Install Conan profile
        run: conan config install ${{github.workspace}}/profiles/Ubuntu-GCC-x86_64 --type=file --target-folder=profiles

      # Fixes conflict between python-setup and conan-setup
      - name: Clear PKG_CONFIG_PATH
        shell: bash
        run: echo "PKG_CONFIG_PATH=" >> $GITHUB_ENV

      - name: Install deps (Conan)
        run: conan install . -pr:a Ubuntu-GCC-x86_64 --output-folder ${{github.workspace}} --build=missing

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.335.0
          cache: true

      - name: verify vulkan
        run: ls ${VULKAN_SDK}

      - name: CMake Configure
        run: cmake --preset conan-release -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build --config Release --target engine_test

      - name: Run unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error
