name: Windows-MSVC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install conan
        run: |
          python -m pip install conan

      # Needed because the profile tells Conan to use the Ninja generator (see that
      # profile for why) instead of the Visual Studio generator it would default to.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Conan profile
        # A relative path is used instead of ${{github.workspace}} because that variable
        # renders with backslashes on Windows, which bash (the shell these steps run
        # under) treats as escape characters and mangles when interpolated into a command.
        run: conan config install ./profiles/Windows-MSVC-x86_64 --type=file --target-folder=profiles

      - name: Install deps (Conan)
        run: conan install . -pr:a Windows-MSVC-x86_64 --output-folder . --build=missing

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.335.0
          cache: true

      - name: verify vulkan
        run: |
          ls "${VULKAN_SDK}"
          # TEMPORARY: find(1) doesn't like Windows-style backslashes, so lean on find's
          # own recursion instead - CMake's FindVulkan can't locate vulkan-1.lib here even
          # though $VULKAN_SDK/Bin exists, so print the actual tree once to see where this
          # action's Windows extraction (7z on the raw installer, not a real install)
          # actually put Lib/Include, then set Vulkan_LIBRARY/Vulkan_INCLUDE_DIR to match
          # (CMakeLists.txt already honors those two env vars if set).
          find "${VULKAN_SDK}" -iname "vulkan-1.lib" -o -iname "vulkan.h" 2>/dev/null

      - name: CMake Configure
        run: cmake --preset conan-release -DCMAKE_BUILD_TYPE=Release

      - name: CMake Build
        run: cmake --build --preset conan-release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
