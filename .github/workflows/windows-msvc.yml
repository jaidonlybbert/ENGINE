name: Windows-MSVC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install conan
        run: |
          python -m pip install conan

      - name: Install Conan profile
        run: conan config install ${{github.workspace}}/profiles/Windows-MSVC-x86_64 --type=file --target-folder=profiles

      - name: Install deps (Conan)
        run: conan install . -pr:a Windows-MSVC-x86_64 --output-folder ${{github.workspace}} --build=missing

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.335.0
          cache: true

      - name: verify vulkan
        run: ls "${VULKAN_SDK}"

      - name: CMake Configure
        run: |
          # MSVC is a multi-config generator, so Conan emits a single "conan-default"
          # configure preset (no per-build-type variant, unlike the single-config Ubuntu
          # jobs) and a "conan-release" build preset that bakes in --config Release.
          cmake --preset conan-default -DCMAKE_BUILD_TYPE=Release

      - name: CMake Build
        run: cmake --build --preset conan-release

      - name: Run Tests
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error
