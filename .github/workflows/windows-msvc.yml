name: Windows-MSVC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install conan
        run: |
          python -m pip install conan

      # CMake's "Visual Studio 17 2022" generator (Conan's default for an msvc profile)
      # locates its VS install via vswhere; that lookup does not reliably succeed for
      # steps running under bash on this runner without the Developer Command Prompt
      # environment this action sets up first.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Conan profile
        # A relative path is used instead of ${{github.workspace}} because that variable
        # renders with backslashes on Windows, which bash (the shell these steps run
        # under) treats as escape characters and mangles when interpolated into a command.
        run: conan config install ./profiles/Windows-MSVC-x86_64 --type=file --target-folder=profiles

      - name: Install deps (Conan)
        run: conan install . -pr:a Windows-MSVC-x86_64 --output-folder . --build=missing

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.335.0
          cache: true

      - name: verify vulkan
        run: ls "${VULKAN_SDK}"

      - name: CMake Configure
        run: |
          # MSVC is a multi-config generator, so Conan emits a single "conan-default"
          # configure preset (no per-build-type variant, unlike the single-config Ubuntu
          # jobs) and a "conan-release" build preset that bakes in --config Release.
          cmake --preset conan-default -DCMAKE_BUILD_TYPE=Release

      - name: CMake Build
        run: cmake --build --preset conan-release

      - name: Run Tests
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error
